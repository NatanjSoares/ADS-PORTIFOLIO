<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
seletores personalizados para links
           #  = id
           .  = class
           :  = pseudo-classe
           :: = pseudo-elemento
           > = filho direto
         */

 body {
            font-family: Arial, sans-serif;
            
            color: rgb(10, 0, 0);   }
    a{
            color: red;
        text-decoration: none;
        font-weight: bold;
        }   
    a:visited {
            color: black;
            text-decoration: underline;} 
    a:hover {
            color: yellow ;
            text-decoration: none;}
     .especial::before {
            color: rgb(252, 250, 250);
            text-decoration: none;
            font-weight: bold;
        }       

    .especial { 
            background-color: rgb(136, 6, 71);
            text-decoration: none;
            font-weight: bold;
        }  
        
     .especial::after 
        
        {content: " (link externo)"; text-decoration: none; color: rgb(252, 250, 250); font-weight: normal;
        color: rgb(252, 250, 250);}

              
        </style>
</head>
<body>
    <h1>Personalizado Links</h1>
    <ul>
        <li><a href="https://www.google.com" target="_blank">Google</a></li>
        <li><a href="https://github.com/NatanjSoares" class="especial" target="_blank">GitHub</a></li>
        <li><a href="https://www.stackoverflow.com" target="_blank">Stack Overflow</a></li> 
    </ul>

</body>
</html>
