<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo de caixa</title>
    <style>
        h1{
            background-color: #f00;
            color: #120000;
            width: 200px;
            height: 200px;
            border-width: 10px;
            border-style: solid;
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
        p{
            background-color: #0f0;
            color: #000;
            padding: 10px;
        }
        a{
            background-color: #00f;
            color: #231313;
            border-width: 1px;
            border-style: dashed;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>Paragrafo também são exemplo de box-level,mas os<a href="#">link são exemplos de caixas inline-level</a>. vamos ver como tudo isso funciona </p>

    
</body>
</html>
