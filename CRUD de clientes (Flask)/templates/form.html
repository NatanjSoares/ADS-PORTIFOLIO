<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">   
</head>
<body>
    <section class="home-card">
        <a class="botao" href="{{ url_for('listar') }}">Voltar</a>
        <h1>Cadastro de Produtos</h1>
    </section>  

    <form method="POST">
    <div>
     <label for="nome">Nome:</label>
    <input
                type="text"
                id="nome"
                name="nome"
                value="{{ produto.nome if produto else '' }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="categoria">Categoria:</label>
            <input
                type="text"
                id="categoria"
                name="categoria"
                value="{{ produto.categoria if produto else '' }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="preco">Preço:</label>
            <input
                type="number"
                id="preco"
                name="preco"
                step="0.01"
                min="0"
                value="{{ produto.preco if produto else '' }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="estoque">Estoque:</label>
            <input
                type="number"
                id="estoque"
                name="estoque"
                min="0"
                value="{{ produto.estoque if produto else '' }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" required>{{ produto.descricao if produto else '' }}</textarea>
        </div>

        <br>

        <button type="submit">Salvar</button>
        <a href="{{ url_for('listar') }}">Cancelar</a>
    </form>
    </section>
</body>
</html>
