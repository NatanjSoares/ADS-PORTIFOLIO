{% extends "base.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
<a class="botao" href="{{ url_for('listar') }}">Voltar</a>
<h1>{{ titulo }}</h1>

<form method="POST" action="">
  <div>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required
           value="{{ produto.nome if produto else '' }}">
  </div>

  <div>
    <label for="categoria">Categoria:</label>
    <input type="text" id="categoria" name="categoria" required
           value="{{ produto.categoria if produto else '' }}">
  </div>

    <div>
    <label for="custo">Custo (R$):</label>
    <input type="number" id="custo" name="custo" step="0.01" min="0"
           value="{{ produto.custo if produto and produto.custo else '' }}">
  </div>

  <div>
    <label for="multiplicador">Multiplicador:</label>
   <select id="multiplicador" name="multiplicador">
  <option value="">Sem multiplicador (preço manual)</option>
  {% for m in multiplicadores %}
  <option value="{{ m.valor }}"
    {% if produto and (produto.get('multiplicador', 0)|float) == m.valor %}selected{% endif %}>
    {{ m.nome }} (×{{ m.valor }})
  </option>
  {% endfor %}
</select>
  </div>

  <div>
    <label for="preco">Preço de venda (R$):</label>
    <input type="number" id="preco" name="preco" step="0.01" min="0"
           value="{{ produto.preco if produto else '' }}">
  </div>

  <div>
    <label for="estoque">Estoque:</label>
    <input type="number" id="estoque" name="estoque" min="0" required
           value="{{ produto.estoque if produto else '' }}">
  </div>

  <div>
    <label for="descricao">Descrição:</label>
    <textarea id="descricao" name="descricao" required>{{ produto.descricao if produto else '' }}</textarea>
  </div>

  <button type="submit">Salvar</button>
  <a href="{{ url_for('listar') }}">Cancelar</a>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/preco.js') }}"></script>
{% endblock %}
