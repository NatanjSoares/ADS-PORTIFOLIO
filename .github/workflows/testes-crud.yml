name: Testes do CRUD

on:
  push:
    branches: [main]
    paths:
      - "CRUD de clientes (Flask)/**"
      - ".github/workflows/testes-crud.yml"
  pull_request:
    paths:
      - "CRUD de clientes (Flask)/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "CRUD de clientes (Flask)"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "CRUD de clientes (Flask)/requirements*.txt"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: python -m pytest -v
  imagem-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Construir a imagem Docker
        run: docker build -t crud-produtos "CRUD de clientes (Flask)"      