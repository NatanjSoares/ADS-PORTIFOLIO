name: Testes do CRUD

on:
  push:
    branches: [main]
    paths:
      - "adonai-produtos/**"
      - ".github/workflows/testes-crud.yml"
  pull_request:
    paths:
      - "adonai-produtos/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "adonai-produtos"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "adonai-produtos/requirements*.txt"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Verificar o código com o Ruff
        run: python -m ruff check .

      - name: Rodar os testes
        run: python -m pytest -v
  imagem-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Construir a imagem Docker
        run: docker build -t crud-produtos "adonai-produtos"      