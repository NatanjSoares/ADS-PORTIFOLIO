<section class="cadastro">
  <h2>Cadastro de Produtos</h2>

  <form (ngSubmit)="cadastrarProduto()">

    <div class="campo">
      <label for="nome">Nome do produto:</label>
      <input
        type="text"
        id="nome"
        name="nome"
        [(ngModel)]="nome"
        placeholder="Digite o nome do produto"
        required
      >
    </div>

    <div class="campo">
      <label for="preco">Preço:</label>
      <input
        type="number"
        id="preco"
        name="preco"
        [(ngModel)]="preco"
        placeholder="Digite o preço"
        min="0.01"
        step="0.01"
        required
      >
    </div>

    <div class="campo">
      <label for="descricao">Descrição:</label>
      <textarea
        id="descricao"
        name="descricao"
        [(ngModel)]="descricao"
        placeholder="Descreva o produto"
        required
      ></textarea>
    </div>

    <button type="submit">Cadastrar produto</button>

  </form>
  <section class="lista-produtos">
  <h2>Produtos cadastrados</h2>

  <div *ngIf="produtos.length === 0">
    <p>Nenhum produto cadastrado.</p>
  </div>

  <div
  class="produto"
  *ngFor="let produto of produtos; let i = index"
>
<button
  type="button"
  (click)="excluirProduto(i)"
  class="btn-excluir"
>
  Excluir
</button>
    <h3>{{ produto.nome }}</h3>

    <p>
      Preço: {{ produto.preco | currency:'BRL' }}
    </p>

    <p>{{ produto.descricao }}</p>
  </div>
</section>
</section>
