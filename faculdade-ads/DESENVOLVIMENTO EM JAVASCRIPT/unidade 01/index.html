<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada Interativo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Gerador de Tabuada Interativo</h1>
        <p>Insira um número entre 1 e 10:</p>

        <form id="formTabuada">
            <label for="numeroInput">Número:</label>
            <input
                type="number"
                id="numeroInput"
                min="1"
                max="10"
                step="1"
                placeholder="Ex.: 5"
                required
            >
            <button type="submit">Gerar tabuada</button>
        </form>

        <section id="resultado" aria-live="polite"></section>
    </main>
</body>
</html>
